provider: "openai"
base_url: ${oc.env:LLM_BASE_URL,null}
api_key: ${oc.env:LLM_API_KEY,null}
model_name: ${oc.env:LLM_MODEL,null}
# LLM_TEMPERATURE=null sends no temperature (Claude 5.5 models reject one).
temperature: ${oc.decode:${oc.env:LLM_TEMPERATURE,0.7}}
# OpenRouter holds credits for max_tokens of every in-flight request; the
# largest reply measured is ~3.5k tokens (intake of a one-zone office).
max_tokens: 16384
timeout: 120
# Thinking budget of reasoning models (OpenRouter reasoning.max_tokens).
# Without one, qwen/qwen3.8-27b spent all of an 8,000-token reply on
# thinking; Gemini 3 maps it to a thinking level, and Claude does not think
# under a forced tool call either way.
reasoning_max_tokens: ${oc.decode:${oc.env:LLM_REASONING_MAX_TOKENS,4096}}

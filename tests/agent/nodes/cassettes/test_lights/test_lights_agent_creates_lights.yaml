    body: '{"messages":[{"content":"You are a lighting-load expert for EnergyPlus.\nCreate
      the Lights objects of the specified zones with create_lights,\none call per
      group of zones with the same values.\n\nWorkflow:\n1. FIRST call `list_zones`
      to see the exact zone names.\n2. FIRST call `list_schedules` to see the exact
      Schedule:Compact names\n   (you need a lighting fraction schedule).\n3. Call
      `create_lights` once per group of zones with the same schedule\n   and values,
      listing the zones in `zone_names`. Its reply names only\n   zones that failed;
      the rest got their object. Do not list afterwards.\n\nRules:\n- Zone names and
      `schedule_name` MUST appear verbatim in the list_zones /\n  list_schedules results.\n-
      If a needed zone or schedule is missing, do NOT invent a name and do NOT\n  list
      again: give your final answer at once, with it in `missing_inputs`.\n- Objects
      are named ''{zone}_Lights''; `name_suffix` changes the suffix,\n  e.g. for a
      second Lights object in a zone.\n- design_level_calculation_method:\n    * ''LightingLevel''
      -> supply lighting_level (W, absolute)\n    * ''Watts/Area'' -> supply watts_per_floor_area
      (W/m^2)\n    * ''Watts/Person'' -> supply watts_per_person (W/person)\n- Typical
      office LPD: 8-12 W/m^2 (Watts/Area). Use 10 when unspecified.\n- fraction_radiant
      ~ 0.7 for recessed fluorescent/LED, 0.42 for pendant.\n- fraction_visible ~
      0.18 for LED.\n","role":"system"},{"content":"Create exactly one Lights object
      named ''F1_Office_Lights'' for zone ''F1_Office'': method Watts/Area at 10 W/m2,
      schedule ''Office_Lighting''.","role":"user"},{"content":null,"role":"assistant","tool_calls":[{"type":"function","id":"call_166295","function":{"name":"list_zones","arguments":"{}"}},{"type":"function","id":"call_166296","function":{"name":"list_schedules","arguments":"{}"}}]},{"content":"{\"success\":
      true, \"message\": \"Listed 1 zones.\", \"data\": [\"F1_Office\"]}","role":"tool","tool_call_id":"call_166295"},{"content":"{\"success\":
      true, \"message\": \"Listed 1 Schedule:Compact.\", \"data\": [{\"name\": \"Office_Lighting\",
      \"schedule_type_limits_name\": \"Fraction\"}]}","role":"tool","tool_call_id":"call_166296"},{"content":null,"role":"assistant","tool_calls":[{"type":"function","id":"call_109998","function":{"name":"create_lights","arguments":"{\"name_suffix\":
      \"Lights\", \"fraction_visible\": 0.18, \"zone_names\": [\"F1_Office\"], \"fraction_radiant\":
      0.7, \"watts_per_floor_area\": 10, \"design_level_calculation_method\": \"Watts/Area\",
      \"schedule_name\": \"Office_Lighting\"}"}}]},{"content":"{\"success\": true,
      \"message\": \"Created Lights in 1 of 1 zones.\", \"data\": null}","role":"tool","tool_call_id":"call_109998"}],"model":"google/gemini-3.8-flash","max_completion_tokens":16384,"parallel_tool_calls":false,"stream":false,"temperature":0.7,"tool_choice":"required","tools":[{"type":"function","function":{"name":"create_lights","description":"Create
      one Lights object, named ''<zone>_<name_suffix>'', per zone.\n\n        Call
      it once per group of zones with the same values.\n\n        Args:\n            zone_names:
      Existing Zone names.\n            schedule_name: Existing Schedule:Compact (Fraction).\n            design_level_calculation_method:
      LightingLevel / Watts/Area / Watts/Person.\n            lighting_level: Absolute
      watts (when method=LightingLevel).\n            watts_per_floor_area: W/m^2
      (when method=Watts/Area).\n            watts_per_person: W/person (when method=Watts/Person).\n            fraction_radiant:
      Radiant fraction (0-1).\n            fraction_visible: Visible light fraction
      (0-1).\n            name_suffix: Name suffix; give another one for a second
      Lights\n                object in the same zones.","parameters":{"properties":{"zone_names":{"items":{"type":"string"},"type":"array"},"schedule_name":{"type":"string"},"design_level_calculation_method":{"default":"Watts/Area","enum":["LightingLevel","Watts/Area","Watts/Person"],"type":"string"},"lighting_level":{"default":0.0,"type":"number"},"watts_per_floor_area":{"default":0.0,"type":"number"},"watts_per_person":{"default":0.0,"type":"number"},"fraction_radiant":{"default":0.0,"type":"number"},"fraction_visible":{"default":0.0,"type":"number"},"name_suffix":{"default":"Lights","type":"string"}},"required":["zone_names","schedule_name"],"type":"object"}}},{"type":"function","function":{"name":"list_lights","description":"List
      Lights objects: name, zone, schedule and level.","parameters":{"properties":{},"type":"object"}}},{"type":"function","function":{"name":"delete_light","description":"Delete

      (W/person)\n- Typical office LPD: 8-12 W/m^2 (Watts/Area). Use 10 when unspecified.\n-
      fraction_radiant ~ 0.7 for recessed fluorescent/LED, 0.42 for pendant.\n- fraction_visible
      ~ 0.18 for LED.\n","role":"system"},{"content":"Create exactly one Lights object

      watts (when method=LightingLevel).\n            watts_per_floor_area: W/m^2
      (when method=Watts/Area).\n            watts_per_person: W/person (when method=Watts/Person).\n            fraction_radiant:
      Radiant fraction (0-1).\n            fraction_visible: Visible light fraction
      (0-1).","parameters":{"properties":{"name":{"type":"string"},"zone_name":{"type":"string"},"schedule_name":{"type":"string"},"design_level_calculation_method":{"default":"Watts/Area","enum":["LightingLevel","Watts/Area","Watts/Person"],"type":"string"},"lighting_level":{"default":0.0,"type":"number"},"watts_per_floor_area":{"default":0.0,"type":"number"},"watts_per_person":{"default":0.0,"type":"number"},"fraction_radiant":{"default":0.0,"type":"number"},"fraction_visible":{"default":0.0,"type":"number"}},"required":["name","zone_name","schedule_name"],"type":"object"}}},{"type":"function","function":{"name":"list_lights","description":"List

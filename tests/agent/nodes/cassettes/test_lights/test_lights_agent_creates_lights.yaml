    body: '{"messages":[{"content":"You are a lighting-load expert for EnergyPlus.\nFor
      each specified zone, create a Lights object via create_light.\n\nWorkflow:\n1.
      FIRST call `list_zones` to see the exact zone names.\n2. FIRST call `list_schedules`
      to see the exact Schedule:Compact names\n   (you need a lighting fraction schedule).\n3.
      Create a Lights object per zone via `create_light`.\n4. Call `list_lights` once
      at the end to confirm.\n\nRules:\n- `zone_name` and `schedule_name` MUST appear
      verbatim in the list_zones /\n  list_schedules results.\n- If a needed zone
      or schedule is missing, STOP and report; do NOT invent names.\n- Use the names
      the specification gives; otherwise ''{zone}_Lights''.\n- design_level_calculation_method:\n    *
      ''LightingLevel'' -> supply lighting_level (W, absolute)\n    * ''Watts/Area''
      -> supply watts_per_floor_area (W/m^2)\n    * ''Watts/Person'' -> supply watts_per_person
      (W/person)\n- Typical office LPD: 8-12 W/m^2 (Watts/Area). Use 10 when unspecified.\n-
      fraction_radiant ~ 0.7 for recessed fluorescent/LED, 0.42 for pendant.\n- fraction_visible
      ~ 0.18 for LED.\n","role":"system"},{"content":"Create exactly one Lights object
      named ''F1_Office_Lights'' for zone ''F1_Office'': method Watts/Area at 10 W/m2,
      schedule ''Office_Lighting''.","role":"user"}],"model":"google/gemini-3.8-flash","max_completion_tokens":16384,"parallel_tool_calls":false,"stream":false,"temperature":0.7,"tool_choice":"required","tools":[{"type":"function","function":{"name":"create_light","description":"Create
      a Lights (lighting load) object.\n\n        Args:\n            name: Unique
      lights object name.\n            zone_name: Existing Zone name.\n            schedule_name:
      Existing Schedule:Compact (Fraction).\n            design_level_calculation_method:
      LightingLevel / Watts/Area / Watts/Person.\n            lighting_level: Absolute
      watts (when method=LightingLevel).\n            watts_per_floor_area: W/m^2
      (when method=Watts/Area).\n            watts_per_person: W/person (when method=Watts/Person).\n            fraction_radiant:
      Radiant fraction (0-1).\n            fraction_visible: Visible light fraction
      (0-1).","parameters":{"properties":{"name":{"type":"string"},"zone_name":{"type":"string"},"schedule_name":{"type":"string"},"design_level_calculation_method":{"default":"Watts/Area","enum":["LightingLevel","Watts/Area","Watts/Person"],"type":"string"},"lighting_level":{"default":0.0,"type":"number"},"watts_per_floor_area":{"default":0.0,"type":"number"},"watts_per_person":{"default":0.0,"type":"number"},"fraction_radiant":{"default":0.0,"type":"number"},"fraction_visible":{"default":0.0,"type":"number"}},"required":["name","zone_name","schedule_name"],"type":"object"}}},{"type":"function","function":{"name":"list_lights","description":"List

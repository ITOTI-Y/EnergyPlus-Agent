      (Fraction).\n            activity_level_schedule_name: Existing Schedule:Compact
      (ActivityLevel limits, W/person).\n            number_of_people_calculation_method:
      People / People/Area / Area/Person.\n            number_of_people: Absolute
      count per zone (use when method=People).\n            people_per_floor_area:
      people/m^2 (use when method=People/Area).\n            floor_area_per_person:
      m^2/person (use when method=Area/Person).\n            fraction_radiant: Radiant
      fraction of sensible heat (0-1).\n            name_suffix: Name suffix; give
      another one for a second People\n                object in the same zones.","parameters":{"properties":{"zone_names":{"items":{"type":"string"},"type":"array"},"number_of_people_schedule_name":{"type":"string"},"activity_level_schedule_name":{"type":"string"},"number_of_people_calculation_method":{"default":"People","enum":["People","People/Area","Area/Person"],"type":"string"},"number_of_people":{"default":0.0,"type":"number"},"people_per_floor_area":{"default":0.0,"type":"number"},"floor_area_per_person":{"default":0.0,"type":"number"},"fraction_radiant":{"default":0.3,"type":"number"},"name_suffix":{"default":"People","type":"string"}},"required":["zone_names","number_of_people_schedule_name","activity_level_schedule_name"],"type":"object"}}},{"type":"function","function":{"name":"list_people","description":"List

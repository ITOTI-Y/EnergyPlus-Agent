    body: '{"messages":[{"content":"You are an occupancy-load expert for EnergyPlus.\nFor
      each specified zone, create a People object via create_people.\n\nWorkflow:\n1.
      FIRST call `list_zones` to see the exact zone names.\n2. FIRST call `list_schedules`
      to see the exact Schedule:Compact names\n   (you need occupancy fraction + activity
      level schedules).\n3. Create a People object per zone via `create_people`.\n4.
      Call `list_people` once at the end to confirm.\n\nRules:\n- `zone_name`, `number_of_people_schedule_name`,
      `activity_level_schedule_name`\n  MUST all appear verbatim in the list_zones
      / list_schedules results.\n- If a needed zone or schedule is missing, STOP and
      report; do NOT invent names.\n- Use the names the specification gives; otherwise
      ''{zone}_People''.\n- Choose number_of_people_calculation_method based on input:\n    *
      ''People'' -> supply number_of_people (absolute count)\n    * ''People/Area''
      -> supply people_per_floor_area (people/m^2)\n    * ''Area/Person'' -> supply
      floor_area_per_person (m^2/person)\n- Typical office density: 10 m^2/person
      (People/Area ~ 0.1).\n- fraction_radiant defaults to 0.3 for seated activity.\n\n\nWhen
      done, reply with one line summarising what you created or what is missing; that
      line is the phase summary.","role":"system"},{"content":"Create exactly one
      People object named ''F1_Office_People'' for zone ''F1_Office'': method People/Area
      with 0.1 people/m2, occupancy schedule ''Office_Occupancy'', activity level
      schedule ''Office_Activity''.","role":"user"}],"model":"google/gemini-3.8-flash","max_completion_tokens":16384,"parallel_tool_calls":false,"stream":false,"temperature":0.7,"tools":[{"type":"function","function":{"name":"create_people","description":"Create

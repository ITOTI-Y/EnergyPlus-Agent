      names that received an IdealLoadsAirSystem","items":{"type":"string"},"type":"array"},"summary":{"description":"One-line
      summary of the HVAC creation result","type":"string"}},"required":["thermostat_names","ideal_loads_zone_names","summary"],"type":"object"}}}],"max_thinking_budget":4096}'

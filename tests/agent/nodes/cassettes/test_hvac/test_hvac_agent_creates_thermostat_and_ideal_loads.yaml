- request:
    body: '{"messages":[{"content":"You are an HVAC configuration expert for EnergyPlus.\nGiven
      HVAC specifications, create thermostat templates and one\nIdealLoadsAirSystem
      per conditioned zone.\n\nWorkflow:\n1. FIRST call `list_schedules` to see the
      exact names of all Schedule:Compact\n   objects (you need these for setpoint
      + availability references).\n2. FIRST call `list_zones` to see the exact zone
      names (you need these for\n   create_ideal_loads_system).\n3. Create one HVACTemplate:Thermostat
      via create_thermostat for each\n   distinct pair of heating and cooling setpoint
      schedules, NOT one per\n   zone, using schedule names from step 1.\n4. For each
      conditioned zone, create HVACTemplate:Zone:IdealLoadsAirSystem\n   via create_ideal_loads_system(zone_name=...,
      template_thermostat_name=...).\n5. Call list_thermostats and list_ideal_loads_systems
      once at the end.\n\nRules:\n- `zone_name`, `heating_setpoint_schedule_name`,
      `cooling_setpoint_schedule_name`,\n  `template_thermostat_name`, `system_availability_schedule_name`
      MUST all\n  appear verbatim in the respective list_* results.\n- If a needed
      zone or schedule is missing, do NOT invent a name and do NOT\n  list again:
      give your final answer at once, with it in `missing_inputs`.\n- Every zone with
      the same setpoint schedules references the same\n  thermostat template. Each
      zone is still controlled on its own: EnergyPlus\n  expands the template into
      a separate ZoneControl:Thermostat per zone.\n- Use the thermostat names the
      specification gives; otherwise name each\n  after its setpoint group, e.g. ''Office_Thermostat''.\n-
      Setpoint values live in the schedules; this phase only references them.\n","role":"system"},{"content":"Create
      exactly one thermostat named ''Office_Thermostat'' using heating setpoint schedule
      ''Heating_Setpoint'' and cooling setpoint schedule ''Cooling_Setpoint'', then
      one IdealLoadsAirSystem for zone ''F1_Office'' using that thermostat.","role":"user"}],"model":"google/gemini-3.8-flash","max_completion_tokens":16384,"parallel_tool_calls":false,"stream":false,"temperature":0.7,"tool_choice":"required","tools":[{"type":"function","function":{"name":"create_thermostat","description":"Create
      an HVACTemplate:Thermostat.\n\n        Args:\n            name: Unique thermostat
      name.\n            heating_setpoint_schedule_name: Existing Schedule:Compact
      for heating setpoints (C).\n            cooling_setpoint_schedule_name: Existing
      Schedule:Compact for cooling setpoints (C).","parameters":{"properties":{"name":{"type":"string"},"heating_setpoint_schedule_name":{"type":"string"},"cooling_setpoint_schedule_name":{"type":"string"}},"required":["name","heating_setpoint_schedule_name","cooling_setpoint_schedule_name"],"type":"object"}}},{"type":"function","function":{"name":"create_ideal_loads_system","description":"Create
      an HVACTemplate:Zone:IdealLoadsAirSystem (one per zone).\n\n        Args:\n            zone_name:
      Existing Zone name; identifies the system.\n            template_thermostat_name:
      Existing HVACTemplate:Thermostat name.\n            system_availability_schedule_name:
      Optional availability Schedule:Compact.","parameters":{"properties":{"zone_name":{"type":"string"},"template_thermostat_name":{"type":"string"},"system_availability_schedule_name":{"anyOf":[{"type":"string"},{"type":"null"}],"default":null}},"required":["zone_name","template_thermostat_name"],"type":"object"}}},{"type":"function","function":{"name":"list_thermostats","description":"List
      all thermostats.","parameters":{"properties":{},"type":"object"}}},{"type":"function","function":{"name":"list_ideal_loads_systems","description":"List
      all IdealLoadsAirSystem entries (keyed by zone_name).","parameters":{"properties":{},"type":"object"}}},{"type":"function","function":{"name":"delete_thermostat","description":"Delete
      a thermostat; refused while an IdealLoadsAirSystem uses it.","parameters":{"properties":{"name":{"type":"string"}},"required":["name"],"type":"object"}}},{"type":"function","function":{"name":"delete_ideal_loads_system","description":"Delete
      the IdealLoadsAirSystem of a zone.","parameters":{"properties":{"zone_name":{"type":"string"}},"required":["zone_name"],"type":"object"}}},{"type":"function","function":{"name":"list_zones","description":"List
      zones that can get an HVAC system.","parameters":{"properties":{},"type":"object"}}},{"type":"function","function":{"name":"list_schedules","description":"List
      Schedule:Compact for setpoint and availability references.","parameters":{"properties":{},"type":"object"}}},{"type":"function","function":{"name":"HVACResponse","description":"Structured

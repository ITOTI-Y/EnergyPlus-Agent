      of object; the phase of that name creates it","enum":["zone","material","construction","schedule","surface"],"type":"string"},"description":{"description":"What
      is needed and for what, e.g. ''a window construction (kind window) for the office
      windows''","type":"string"}},"required":["kind","description"],"type":"object"},"type":"array"},"thermostat_names":{"description":"Names
      of all thermostats created","items":{"type":"string"},"type":"array"},"ideal_loads_zone_names":{"description":"Zone
      names that received an IdealLoadsAirSystem","items":{"type":"string"},"type":"array"},"summary":{"description":"One-line

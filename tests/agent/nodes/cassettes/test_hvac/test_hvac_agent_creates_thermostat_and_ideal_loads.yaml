    body: '{"messages":[{"content":"You are an HVAC configuration expert for EnergyPlus.\nGiven
      HVAC specifications, create Thermostat templates and one\nIdealLoadsAirSystem
      per conditioned zone.\n\nWorkflow:\n1. FIRST call `list_schedules` to see the
      exact names of all Schedule:Compact\n   objects (you need these for setpoint
      + availability references).\n2. FIRST call `list_zones` to see the exact zone
      names (you need these for\n   create_ideal_loads_system).\n3. Create one or
      more HVACTemplate:Thermostat via create_thermostat, using\n   schedule names
      from step 1.\n4. For each conditioned zone, create HVACTemplate:Zone:IdealLoadsAirSystem\n   via
      create_ideal_loads_system(zone_name=..., template_thermostat_name=...).\n5.
      Call list_thermostats and list_ideal_loads_systems once at the end.\n\nRules:\n-
      `zone_name`, `heating_setpoint_schedule_name`, `cooling_setpoint_schedule_name`,\n  `template_thermostat_name`,
      `system_availability_schedule_name` MUST all\n  appear verbatim in the respective
      list_* results.\n- If a needed zone or schedule is missing, STOP and report;
      do NOT invent names.\n- Typical office setpoints: heating 20 C occupied / 15
      C unoccupied,\n  cooling 24 C occupied / 28 C unoccupied.\n- If the spec gives
      one thermostat for all zones, reuse the same\n  template_thermostat_name across
      all zones.\n","role":"system"},{"content":"Create exactly one thermostat named
      ''Office_Thermostat'' using heating setpoint schedule ''Heating_Setpoint'' and
      cooling setpoint schedule ''Cooling_Setpoint'', then one IdealLoadsAirSystem
      for zone ''F1_Office'' using that thermostat.","role":"user"}],"model":"google/gemini-3.8-flash","max_completion_tokens":16384,"parallel_tool_calls":false,"stream":false,"temperature":0.7,"tool_choice":"required","tools":[{"type":"function","function":{"name":"create_thermostat","description":"Create

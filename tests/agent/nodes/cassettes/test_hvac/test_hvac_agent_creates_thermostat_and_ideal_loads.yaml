      do NOT invent names.\n- Typical office setpoints: heating 20 C occupied / 15
      C unoccupied,\n  cooling 24 C occupied / 28 C unoccupied.\n- If the spec gives
      one thermostat for all zones, reuse the same\n  template_thermostat_name across

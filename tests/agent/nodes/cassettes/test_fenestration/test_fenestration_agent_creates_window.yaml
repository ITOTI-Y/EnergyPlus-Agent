- request:
    body: "{\"messages\":[{\"content\":\"You are a window/door geometry expert for
      EnergyPlus.\\nGiven fenestration specifications, create FenestrationSurface:Detailed\\nobjects
      (windows, doors, skylights) that lie on existing parent surfaces.\\n\\nVertices
      MUST be a list of dicts with explicit X / Y / Z keys (not a\\nbare [x, y, z]
      list). Example: a 1.5m x 1.2m window centered on a south\\nwall that spans x=0..5
      at y=0, window sill at 0.8m:\\n\\n    [\\n      {\\\"X\\\": 1.75, \\\"Y\\\":
      0.0, \\\"Z\\\": 0.8},\\n      {\\\"X\\\": 3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 0.8},\\n
      \     {\\\"X\\\": 3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0},\\n      {\\\"X\\\":
      1.75, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0}\\n    ]\\n\\nWorkflow:\\n1. FIRST call
      `list_surfaces` to see parent surface names AND their\\n   vertex geometry \u2014
      you need the parent surface's plane to place the\\n   fenestration's coplanar
      vertices correctly.\\n2. THEN call `list_constructions` to find glazing/door
      construction names.\\n3. Create each fenestration via `create_fenestration`.\\n4.
      Call `list_fenestrations` once at the end to confirm.\\n\\nRules:\\n- `building_surface_name`
      and `construction_name` MUST appear verbatim\\n  in the list_surfaces / list_constructions
      results.\\n- If a needed surface or construction is missing after list, STOP
      and\\n  report; do NOT invent names.\\n- construction_name should be a Glazing
      construction for windows/skylights.\\n- >= 3 vertices, counter-clockwise from
      OUTSIDE, and MUST lie on the\\n  parent surface's plane (coplanar \u2014 share
      one coordinate for walls).\\n- surface_type is Window, Door, or GlassDoor.\\n-
      Typical window-to-wall ratio: 0.3-0.4 on facade walls; derive vertex\\n  coordinates
      from the parent wall's corners and the WWR.\\n- Naming: '{parent_surface}_Window'
      or '{zone}_{direction}_Window_{index}'.\\n\",\"role\":\"system\"},{\"content\":\"Create
      exactly one window named 'F1_Office_South_Wall_Window' on surface 'F1_Office_South_Wall'
      with construction 'Window_Simple': 1.5m wide x 1.2m tall, centered horizontally,
      sill at 0.8m.\",\"role\":\"user\"}],\"model\":\"opencode/glm-5.2\",\"max_completion_tokens\":64000,\"parallel_tool_calls\":false,\"stream\":false,\"temperature\":0.7,\"tool_choice\":\"required\",\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"create_fenestration\",\"description\":\"Create
      a FenestrationSurface:Detailed (window/door/skylight).\\n\\n        Args:\\n
      \           name: Unique fenestration name.\\n            surface_type: Window
      / Door / GlassDoor.\\n            construction_name: Existing Glazing construction
      name.\\n            building_surface_name: Existing parent Surface name.\\n
      \           vertices: List of vertex dicts in meters. Each vertex is\\n                      `{\\\"X\\\":
      float, \\\"Y\\\": float, \\\"Z\\\": float}`. >= 3 points,\\n                      counter-clockwise
      from the outside, MUST lie on the\\n                      parent surface plane
      (coplanar).\\n                      Example 1.5x1.2m window centered on a south
      wall at\\n                      sill 0.8m (wall at y=0, spans x=0..5):\\n                        [{\\\"X\\\":
      1.75, \\\"Y\\\": 0.0, \\\"Z\\\": 0.8},\\n                         {\\\"X\\\":
      3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 0.8},\\n                         {\\\"X\\\":
      3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0},\\n                         {\\\"X\\\":
      1.75, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0}]\\n            multiplier: Number of identical
      copies (>= 1).\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"},\"surface_type\":{\"enum\":[\"Window\",\"Door\",\"GlassDoor\"],\"type\":\"string\"},\"construction_name\":{\"type\":\"string\"},\"building_surface_name\":{\"type\":\"string\"},\"vertices\":{\"items\":{\"additionalProperties\":{\"type\":\"number\"},\"type\":\"object\"},\"type\":\"array\"},\"multiplier\":{\"default\":1,\"type\":\"integer\"}},\"required\":[\"name\",\"surface_type\",\"construction_name\",\"building_surface_name\",\"vertices\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_fenestrations\",\"description\":\"List
      all fenestration surfaces.\",\"parameters\":{\"properties\":{},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"get_fenestration\",\"description\":\"Read
      a fenestration by name.\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"}},\"required\":[\"name\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"delete_fenestration\",\"description\":\"Delete
      a fenestration.\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"}},\"required\":[\"name\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_surfaces\",\"description\":\"Read-only:
      list parent surfaces a fenestration can attach to.\",\"parameters\":{\"properties\":{},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_constructions\",\"description\":\"Read-only:
      list constructions a fenestration can reference.\",\"parameters\":{\"properties\":{},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"FenestrationResponse\",\"description\":\"Structured

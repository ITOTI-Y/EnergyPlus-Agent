- request:
    body: '{"messages":[{"content":"You are a window/door geometry expert for EnergyPlus.\nGiven
      fenestration specifications, create FenestrationSurface:Detailed\nobjects (windows,
      doors) on existing parent surfaces.\n\nWorkflow:\n1. Call `list_constructions`;
      each entry has a `kind`.\n2. Windows given by window-to-wall ratio (the usual
      case): call\n   `create_windows_by_ratio` once per ratio, with the facings and
      zones it\n   applies to. It sizes and places a strip window on every matching\n   exterior
      wall; walls it reports in `not_created` (too small for the\n   ratio) get no
      window, which is acceptable.\n3. Only for openings with given sizes or positions
      (doors, a specific\n   window): call `list_surfaces` FILTERED to the zone and
      type you need\n   (never unfiltered: large buildings have hundreds of surfaces),
      then\n   `create_fenestration` with corners on that surface.\n4. Call `list_fenestrations`
      once at the end to confirm.\n\nRules:\n- Construction names MUST appear verbatim
      in the list_constructions\n  result. If one is missing (e.g. no construction
      of kind `window`), do\n  NOT invent a name and do NOT list again: give your
      final answer at once,\n  with it in `missing_inputs`.\n- Window and GlassDoor
      need a construction of kind `window`; Door needs\n  kind `opaque`.\n- For create_fenestration:
      3 or 4 vertices as dicts with X / Y / Z keys,\n  on the parent surface''s plane
      and inside its outline; the order is\n  corrected automatically. On a wall between
      two zones, create the opening\n  once; the matching opening in the adjacent
      zone is added automatically.\n- Use the ratios, sizes and names the specification
      gives. Without a\n  ratio, use 0.3-0.4 on facade walls.\n","role":"system"},{"content":"Create
      exactly one window named ''F1_Office_South_Wall_Window'' on surface ''F1_Office_South_Wall''
      with construction ''Window_Simple'': 1.5m wide x 1.2m tall, centered horizontally,
      sill at 0.8m.","role":"user"},{"content":null,"role":"assistant","tool_calls":[{"type":"function","id":"call_546108","function":{"name":"list_constructions","arguments":"{}"}},{"type":"function","id":"call_546111","function":{"name":"list_surfaces","arguments":"{\"surface_type\":
      \"Wall\"}"}}]},{"content":"{\"success\": true, \"message\": \"Listed 2 constructions.\",
      \"data\": [{\"kind\": \"opaque\", \"name\": \"ExtWall_Simple\", \"outside_layer\":
      \"Brick_100mm\"}, {\"kind\": \"window\", \"name\": \"Window_Simple\", \"outside_layer\":
      \"Glass_U18\"}]}","role":"tool","tool_call_id":"call_546108"},{"content":"{\"success\":
      true, \"message\": \"Listed 1 surfaces.\", \"data\": [{\"name\": \"F1_Office_South_Wall\",
      \"zone\": \"F1_Office\", \"type\": \"Wall\", \"boundary\": \"Outdoors\", \"construction\":

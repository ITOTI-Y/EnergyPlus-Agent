- request:
    body: "{\"messages\":[{\"content\":\"You are a window/door geometry expert for
      EnergyPlus.\\nGiven fenestration specifications, create FenestrationSurface:Detailed\\nobjects
      (windows, doors, skylights) that lie on existing parent surfaces.\\n\\nVertices
      MUST be a list of dicts with explicit X / Y / Z keys (not a\\nbare [x, y, z]
      list). Example: a 1.5m x 1.2m window centered on a south\\nwall that spans x=0..5
      at y=0, window sill at 0.8m:\\n\\n    [\\n      {\\\"X\\\": 1.75, \\\"Y\\\":
      0.0, \\\"Z\\\": 0.8},\\n      {\\\"X\\\": 3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 0.8},\\n
      \     {\\\"X\\\": 3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0},\\n      {\\\"X\\\":
      1.75, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0}\\n    ]\\n\\nWorkflow:\\n1. FIRST call
      `list_surfaces` to see parent surface names AND their\\n   vertex geometry \u2014
      you need the parent surface's plane to place the\\n   fenestration's coplanar
      vertices correctly.\\n2. THEN call `list_constructions`; each entry has a `kind`.\\n3.
      Create each fenestration via `create_fenestration`.\\n4. Call `list_fenestrations`
      once at the end to confirm.\\n\\nRules:\\n- `building_surface_name` and `construction_name`
      MUST appear verbatim\\n  in the list_surfaces / list_constructions results.\\n-
      If a needed surface or construction is missing after list, STOP and\\n  report;
      do NOT invent names.\\n- Window and GlassDoor need a construction of kind `window`;
      Door needs\\n  kind `opaque`.\\n- 3 or 4 vertices that MUST lie on the parent
      surface's plane (coplanar \u2014\\n  share one coordinate for walls) and inside
      its outline. The vertex order\\n  is corrected to match the parent surface automatically.\\n-
      On a wall between two zones, create the opening once; the matching\\n  opening
      in the adjacent zone is added automatically.\\n- surface_type is Window, Door,
      or GlassDoor.\\n- Use the sizes and positions the specification gives. Only
      when it gives\\n  none, use a window-to-wall ratio of 0.3-0.4 on facade walls
      and derive\\n  the vertices from the parent wall's corners.\\n- Use the names
      the specification gives; otherwise\\n  '{parent_surface}_Window' or '{zone}_{direction}_Window_{index}'.\\n\",\"role\":\"system\"},{\"content\":\"Create
      exactly one window named 'F1_Office_South_Wall_Window' on surface 'F1_Office_South_Wall'
      with construction 'Window_Simple': 1.5m wide x 1.2m tall, centered horizontally,
      sill at 0.8m.\",\"role\":\"user\"},{\"content\":null,\"role\":\"assistant\",\"tool_calls\":[{\"type\":\"function\",\"id\":\"call_511903\",\"function\":{\"name\":\"list_surfaces\",\"arguments\":\"{}\"}},{\"type\":\"function\",\"id\":\"call_511906\",\"function\":{\"name\":\"list_constructions\",\"arguments\":\"{}\"}}]},{\"content\":\"{\\\"success\\\":
      true, \\\"message\\\": \\\"Listed 1 BuildingSurface:Detailed.\\\", \\\"data\\\":
      [{\\\"name\\\": \\\"F1_Office_South_Wall\\\", \\\"surface_type\\\": \\\"Wall\\\",
      \\\"construction_name\\\": \\\"ExtWall_Simple\\\", \\\"zone_name\\\": \\\"F1_Office\\\",
      \\\"outside_boundary_condition\\\": \\\"Outdoors\\\", \\\"sun_exposure\\\":
      \\\"SunExposed\\\", \\\"wind_exposure\\\": \\\"WindExposed\\\", \\\"view_factor_to_ground\\\":
      \\\"Autocalculate\\\", \\\"number_of_vertices\\\": 4.0, \\\"vertices\\\": [{\\\"vertex_x_coordinate\\\":
      0.0, \\\"vertex_y_coordinate\\\": 0.0, \\\"vertex_z_coordinate\\\": 3.0}, {\\\"vertex_x_coordinate\\\":
      0.0, \\\"vertex_y_coordinate\\\": 0.0, \\\"vertex_z_coordinate\\\": 0.0}, {\\\"vertex_x_coordinate\\\":
      6.0, \\\"vertex_y_coordinate\\\": 0.0, \\\"vertex_z_coordinate\\\": 0.0}, {\\\"vertex_x_coordinate\\\":
      6.0, \\\"vertex_y_coordinate\\\": 0.0, \\\"vertex_z_coordinate\\\": 3.0}]}]}\",\"role\":\"tool\",\"tool_call_id\":\"call_511903\"},{\"content\":\"{\\\"success\\\":
      true, \\\"message\\\": \\\"Listed 2 constructions.\\\", \\\"data\\\": [{\\\"kind\\\":
      \\\"opaque\\\", \\\"name\\\": \\\"ExtWall_Simple\\\", \\\"outside_layer\\\":
      \\\"Brick_100mm\\\"}, {\\\"kind\\\": \\\"window\\\", \\\"name\\\": \\\"Window_Simple\\\",
      \\\"outside_layer\\\": \\\"Glass_U18\\\"}]}\",\"role\":\"tool\",\"tool_call_id\":\"call_511906\"},{\"content\":null,\"role\":\"assistant\",\"tool_calls\":[{\"type\":\"function\",\"id\":\"call_680993\",\"function\":{\"name\":\"create_fenestration\",\"arguments\":\"{\\\"building_surface_name\\\":
      \\\"F1_Office_South_Wall\\\", \\\"name\\\": \\\"F1_Office_South_Wall_Window\\\",

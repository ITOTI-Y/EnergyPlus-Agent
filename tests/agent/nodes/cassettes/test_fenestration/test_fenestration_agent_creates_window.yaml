      Existing parent surface name. On a wall\\n                shared with another
      zone, the matching opening in that zone is\\n                created automatically.\\n
      \           vertices: 3 or 4 vertices in meters on the parent surface plane\\n
      \               and inside its outline; the order is corrected to match the\\n
      \               parent surface. Example 1.5x1.2m\\n                window centered
      on a south wall at sill 0.8m (wall at y=0,\\n                spans x=0..5):\\n
      \                 [{\\\"X\\\": 1.75, \\\"Y\\\": 0.0, \\\"Z\\\": 0.8},\\n                   {\\\"X\\\":
      3.25, \\\"Y\\\": 0.0, \\\"Z\\\": 0.8},\\n                   {\\\"X\\\": 3.25,
      \\\"Y\\\": 0.0, \\\"Z\\\": 2.0},\\n                   {\\\"X\\\": 1.75, \\\"Y\\\":
      0.0, \\\"Z\\\": 2.0}]\\n            multiplier: Number of identical copies (>=
      1).\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"},\"surface_type\":{\"enum\":[\"Window\",\"Door\",\"GlassDoor\"],\"type\":\"string\"},\"construction_name\":{\"type\":\"string\"},\"building_surface_name\":{\"type\":\"string\"},\"vertices\":{\"items\":{\"description\":\"One
      polygon vertex in metres, world coordinates.\",\"properties\":{\"X\":{\"type\":\"number\"},\"Y\":{\"type\":\"number\"},\"Z\":{\"type\":\"number\"}},\"required\":[\"X\",\"Y\",\"Z\"],\"type\":\"object\"},\"type\":\"array\"},\"multiplier\":{\"default\":1,\"type\":\"integer\"}},\"required\":[\"name\",\"surface_type\",\"construction_name\",\"building_surface_name\",\"vertices\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_fenestrations\",\"description\":\"List

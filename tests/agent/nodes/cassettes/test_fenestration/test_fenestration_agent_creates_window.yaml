      2.25}, {\\\"Z\\\": 0.8, \\\"X\\\": 3.75, \\\"Y\\\": 0}, {\\\"Z\\\": 2, \\\"X\\\":
      3.75, \\\"Y\\\": 0}, {\\\"Y\\\": 0, \\\"X\\\": 2.25, \\\"Z\\\": 2}], \\\"construction_name\\\":
      \\\"Window_Simple\\\", \\\"surface_type\\\": \\\"Window\\\"}\"}}]},{\"content\":\"{\\\"success\\\":

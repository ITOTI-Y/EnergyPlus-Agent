      is needed and for what, e.g. ''a window construction (kind window) for the office
      windows''","type":"string"}},"required":["kind","description"],"type":"object"},"type":"array"},"fenestration_names":{"description":"Names
      of all fenestration surfaces created","items":{"type":"string"},"type":"array"},"summary":{"description":"One-line
      summary of the fenestration creation result","type":"string"}},"required":["fenestration_names","summary"],"type":"object"}}}],"reasoning":{"max_tokens":4096}}'

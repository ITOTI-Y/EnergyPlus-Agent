      (W/m-K), density (kg/m^3), specific heat (J/kg-K).\n- create_nomass_material
      when only R-value is known (thin finishes, membranes).\n- create_airgap_material
      for enclosed air cavities in OPAQUE wall/roof\n  assemblies only. Never use
      it in a window.\n- Windows, either:\n  * create_glazing_material for a simplified
      window given as a whole:\n    u_factor (W/m^2-K), solar_heat_gain_coefficient
      (0-1), optional\n    visible_transmittance (0-1). It is used as the only layer.\n  *
      or, for an explicit multi-pane window, create_window_glazing_material\n    for
      each glass pane (thickness in m) and create_window_gas_material for\n    the
      gap between panes (Air / Argon / Krypton / Xenon, thickness in m).\n\nRules:\n-
      Use the material names the specification gives, verbatim; constructions\n  reference
      them. Name other materials uniquely and self-describing with\n  letters, digits
      and ''_'' only (e.g., ''Brick_100mm'', ''EPS_Insulation_R5'',\n  ''Window_U1p8_SHGC0p4'').\n-
      Roughness options: VeryRough, Rough, MediumRough, MediumSmooth, Smooth, VerySmooth.\n-
      Use typical ASHRAE values when the description is vague.\n- Call list_materials

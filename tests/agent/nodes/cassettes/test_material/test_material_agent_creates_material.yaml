      Unique material name.\n            roughness: Surface roughness.\n            thickness:
      Meters, > 0.\n            conductivity: W/(m*K), > 0.\n            density:
      kg/m^3, > 0.\n            specific_heat: J/(kg*K), > 0.","parameters":{"properties":{"name":{"type":"string"},"roughness":{"enum":["VeryRough","Rough","MediumRough","MediumSmooth","Smooth","VerySmooth"],"type":"string"},"thickness":{"type":"number"},"conductivity":{"type":"number"},"density":{"type":"number"},"specific_heat":{"type":"number"}},"required":["name","roughness","thickness","conductivity","density","specific_heat"],"type":"object"}}},{"type":"function","function":{"name":"create_nomass_material","description":"Create
      a NoMass material (R-value only).\n\n        Args:\n            name: Unique
      material name.\n            roughness: Surface roughness.\n            thermal_resistance:
      R-value, m^2*K/W, > 0.","parameters":{"properties":{"name":{"type":"string"},"roughness":{"enum":["VeryRough","Rough","MediumRough","MediumSmooth","Smooth","VerySmooth"],"type":"string"},"thermal_resistance":{"type":"number"}},"required":["name","roughness","thermal_resistance"],"type":"object"}}},{"type":"function","function":{"name":"create_airgap_material","description":"Create
      an AirGap material for opaque walls, roofs and floors.\n\n        Not for windows:
      separate glass panes with create_window_gas_material.\n\n        Args:\n            name:
      Unique material name.\n            thermal_resistance: Air cavity resistance,
      m^2*K/W.","parameters":{"properties":{"name":{"type":"string"},"thermal_resistance":{"type":"number"}},"required":["name","thermal_resistance"],"type":"object"}}},{"type":"function","function":{"name":"create_glazing_material","description":"Create
      a Glazing material (simplified window).\n\n        Args:\n            name:
      Unique material name.\n            u_factor: Overall U-value, W/(m^2*K), > 0.\n            solar_heat_gain_coefficient:
      SHGC, 0-1.\n            visible_transmittance: Optional VT, 0-1.","parameters":{"properties":{"name":{"type":"string"},"u_factor":{"type":"number"},"solar_heat_gain_coefficient":{"type":"number"},"visible_transmittance":{"anyOf":[{"type":"number"},{"type":"null"}],"default":null}},"required":["name","u_factor","solar_heat_gain_coefficient"],"type":"object"}}},{"type":"function","function":{"name":"create_window_glazing_material","description":"Create
      one glass pane for a multi-pane window (WindowMaterial:Glazing).\n\n        Defaults
      describe clear float glass; both faces share the reflectances.\n\n        Args:\n            name:
      Unique material name.\n            thickness: Pane thickness in meters, e.g.
      0.006.\n            solar_transmittance: At normal incidence, 0-1.\n            solar_reflectance:
      At normal incidence, 0-1.\n            visible_transmittance: At normal incidence,
      0-1.\n            visible_reflectance: At normal incidence, 0-1.\n            conductivity:
      W/(m*K).","parameters":{"properties":{"name":{"type":"string"},"thickness":{"type":"number"},"solar_transmittance":{"default":0.775,"type":"number"},"solar_reflectance":{"default":0.071,"type":"number"},"visible_transmittance":{"default":0.881,"type":"number"},"visible_reflectance":{"default":0.08,"type":"number"},"conductivity":{"default":0.9,"type":"number"}},"required":["name","thickness"],"type":"object"}}},{"type":"function","function":{"name":"create_window_gas_material","description":"Create
      the gas layer between two glass panes (WindowMaterial:Gas).\n\n        Args:\n            name:
      Unique material name.\n            thickness: Gap width in meters, e.g. 0.012.\n            gas_type:
      Fill gas.","parameters":{"properties":{"name":{"type":"string"},"thickness":{"type":"number"},"gas_type":{"default":"Air","enum":["Air","Argon","Krypton","Xenon"],"type":"string"}},"required":["name","thickness"],"type":"object"}}},{"type":"function","function":{"name":"list_materials","description":"List
      all materials, with their EnergyPlus type.","parameters":{"properties":{},"type":"object"}}},{"type":"function","function":{"name":"get_material","description":"Read
      a material by name.","parameters":{"properties":{"name":{"type":"string"}},"required":["name"],"type":"object"}}},{"type":"function","function":{"name":"delete_material","description":"Delete

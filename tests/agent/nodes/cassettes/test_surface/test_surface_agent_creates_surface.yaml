      you may use.\n2. For every zone with vertical walls and a flat top, call\n   `create_zone_geometry`
      once: the floor plan corners (X, Y in meters, in\n   order around the zone),
      floor level, height and five constructions\n   (exterior wall, roof, ground
      floor, interior wall, interior floor).\n   It creates walls, floor and roof,
      and turns faces shared with other\n   zones into interzone pairs automatically,
      in any order, also for zones\n   of different height and storeys whose plans
      do not line up. Do NOT\n   build such zones surface by surface.\n3. Only for
      geometry an extrusion cannot express (sloped or pitched roofs,\n   gable walls,
      sloped walls), call `create_surfaces` with all those\n   surfaces at once; resend
      only entries reported as failed.\n4. Call `list_surfaces` once at the end to
      confirm.\n\nRules:\n- `zone_name` and construction names MUST appear verbatim
      in the\n  list_zones / list_constructions results.\n- If a needed zone or construction
      is missing, STOP and report; do NOT\n  invent names.\n- Floor level 0 is the
      ground; upper storeys start at the sum of the\n  storey heights below them.\n-
      Vertices for create_surfaces are dicts with X / Y / Z keys in meters,\n  counter-clockwise
      seen from OUTSIDE the zone.\n","role":"system"},{"content":"Create exactly one
      floor surface named ''F1_Office_Floor'' for zone ''F1_Office'' with construction

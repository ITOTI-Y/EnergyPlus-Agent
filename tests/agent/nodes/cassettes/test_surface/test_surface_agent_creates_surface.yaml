- request:
    body: "{\"messages\":[{\"content\":\"You are a building geometry expert for EnergyPlus.\\nGiven
      surface specifications, create all BuildingSurface:Detailed objects\\n(walls,
      floors, roofs, ceilings) with 3D vertex polygons.\\n\\nVertices MUST be a list
      of dicts, each with explicit X / Y / Z keys (not\\na bare [x, y, z] list). Meters,
      in the global coordinate system. Example\\nshape for a 5m x 2m south wall at
      y=0 (ground to 2m tall):\\n\\n    [\\n      {\\\"X\\\": 0.0, \\\"Y\\\": 0.0,
      \\\"Z\\\": 0.0},\\n      {\\\"X\\\": 5.0, \\\"Y\\\": 0.0, \\\"Z\\\": 0.0},\\n
      \     {\\\"X\\\": 5.0, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0},\\n      {\\\"X\\\":
      0.0, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0}\\n    ]\\n\\nWorkflow:\\n1. FIRST call
      `list_zones` to discover the exact zone names created by\\n   the zone phase.\\n2.
      THEN call `list_constructions` to discover the exact construction\\n   names
      and their layer composition (helps you match the right\\n   construction to
      each surface type \u2014 wall / floor / roof / window).\\n3. Create each surface
      via `create_surface`, reusing those names verbatim.\\n4. Call `list_surfaces`
      once at the end to confirm.\\n\\nRules:\\n- `zone_name` and `construction_name`
      MUST appear verbatim in the\\n  list_zones / list_constructions results (exact
      case, underscores).\\n- If a needed zone or construction is missing after list,
      STOP and\\n  report; do NOT invent names or create a surface with a broken reference.\\n-
      >= 3 vertices per surface; four-vertex rectangles are most common.\\n- Order
      counter-clockwise when viewed from OUTSIDE the zone.\\n- No two vertices may
      coincide (tolerance 1e-10 m).\\n- outside_boundary_condition:\\n    * Walls/roofs
      facing outdoors: 'Outdoors',\\n      sun_exposure='SunExposed', wind_exposure='WindExposed'\\n
      \   * Floors on ground slab: 'Ground',\\n      sun_exposure='NoSun', wind_exposure='NoWind'\\n
      \   * Internal partitions between zones: 'Surface',\\n      sun_exposure='NoSun',
      wind_exposure='NoWind',\\n      and outside_boundary_condition_object must reference
      the matching\\n      partner surface in the other zone\\n    * Adiabatic walls
      (e.g., between identical thermal zones): 'Adiabatic'\\n- surface_type is one
      of Wall, Floor, Roof, Ceiling (case-insensitive).\\n- Name convention: '{zone}_{direction}_{type}',
      e.g.,\\n  'F1_Office_North_Wall', 'F1_Office_Floor', 'F1_Office_Roof'.\\n\",\"role\":\"system\"},{\"content\":\"Create
      exactly one floor surface named 'F1_Office_Floor' for zone 'F1_Office' with
      construction 'ExtWall_Simple': a 6m x 6m square at ground level (z=0, corners
      (0,0), (6,0), (6,6), (0,6)), outside boundary condition Ground.\",\"role\":\"user\"}],\"model\":\"opencode/glm-5.2\",\"max_completion_tokens\":64000,\"parallel_tool_calls\":false,\"stream\":false,\"temperature\":0.7,\"tool_choice\":\"required\",\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"create_surface\",\"description\":\"Create
      a BuildingSurface:Detailed (wall/floor/roof/ceiling).\\n\\n        Args:\\n
      \           name: Unique surface name.\\n            surface_type: Wall / Floor
      / Roof / Ceiling.\\n            construction_name: Existing Construction name.\\n
      \           zone_name: Existing Zone name the surface belongs to.\\n            outside_boundary_condition:
      Outdoors / Ground / Zone / Adiabatic / Surface.\\n            vertices: List
      of vertex dicts in meters. Each vertex is\\n                      `{\\\"X\\\":
      float, \\\"Y\\\": float, \\\"Z\\\": float}`. >= 3 points,\\n                      ordered
      counter-clockwise when viewed from OUTSIDE.\\n                      Example
      4-vertex south wall (2m tall, 5m wide, at y=0):\\n                        [{\\\"X\\\":
      0.0, \\\"Y\\\": 0.0, \\\"Z\\\": 0.0},\\n                         {\\\"X\\\":
      5.0, \\\"Y\\\": 0.0, \\\"Z\\\": 0.0},\\n                         {\\\"X\\\":
      5.0, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0},\\n                         {\\\"X\\\":
      0.0, \\\"Y\\\": 0.0, \\\"Z\\\": 2.0}]\\n            sun_exposure: SunExposed
      / NoSun (use SunExposed for outdoor-facing walls/roof).\\n            wind_exposure:
      WindExposed / NoWind.\\n            outside_boundary_condition_object: Matching
      surface name when\\n                                               outside_boundary_condition
      in {Surface, Zone}.\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"},\"surface_type\":{\"enum\":[\"Ceiling\",\"Floor\",\"Roof\",\"Wall\"],\"type\":\"string\"},\"construction_name\":{\"type\":\"string\"},\"zone_name\":{\"type\":\"string\"},\"outside_boundary_condition\":{\"enum\":[\"Outdoors\",\"Ground\",\"Zone\",\"Adiabatic\",\"Surface\"],\"type\":\"string\"},\"vertices\":{\"items\":{\"additionalProperties\":{\"type\":\"number\"},\"type\":\"object\"},\"type\":\"array\"},\"sun_exposure\":{\"default\":\"NoSun\",\"enum\":[\"SunExposed\",\"NoSun\"],\"type\":\"string\"},\"wind_exposure\":{\"default\":\"NoWind\",\"enum\":[\"WindExposed\",\"NoWind\"],\"type\":\"string\"},\"outside_boundary_condition_object\":{\"anyOf\":[{\"enum\":[\"Surface\",\"Zone\"],\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null}},\"required\":[\"name\",\"surface_type\",\"construction_name\",\"zone_name\",\"outside_boundary_condition\",\"vertices\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_surfaces\",\"description\":\"List
      all building surfaces.\",\"parameters\":{\"properties\":{},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"get_surface\",\"description\":\"Read
      a surface by name.\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"}},\"required\":[\"name\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"delete_surface\",\"description\":\"Delete
      a surface. Fails if fenestration references it.\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"}},\"required\":[\"name\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_zones\",\"description\":\"Read-only:
      list zones a surface can be assigned to.\",\"parameters\":{\"properties\":{},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_constructions\",\"description\":\"Read-only:
      list constructions a surface can reference.\",\"parameters\":{\"properties\":{},\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"SurfaceResponse\",\"description\":\"Structured
      summary returned by the surface phase agent.\",\"parameters\":{\"properties\":{\"surface_names\":{\"description\":\"Names
      of all surfaces created\",\"items\":{\"type\":\"string\"},\"type\":\"array\"},\"summary\":{\"description\":\"One-line
      summary of the surface creation result\",\"type\":\"string\"}},\"required\":[\"surface_names\",\"summary\"],\"type\":\"object\"}}}],\"max_thinking_budget\":4096}"

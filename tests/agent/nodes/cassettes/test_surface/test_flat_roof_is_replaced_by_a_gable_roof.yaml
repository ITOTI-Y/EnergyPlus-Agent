      `list_constructions` for the opaque constructions you may use.\n2. `delete_surface`
      each flat face the sloped geometry replaces, e.g. the\n   flat roof under a
      pitched roof.\n3. Call `create_surfaces` once with all new surfaces (roof planes,
      gable\n   walls); resend only entries reported as failed. Its reply is final:

      design_level_calculation_method:\n    * ''EquipmentLevel'' -> supply design_level
      (W, absolute)\n    * ''Watts/Area'' -> supply watts_per_floor_area (W/m^2)\n    *
      ''Watts/Person'' -> supply watts_per_person (W/person)\n- Typical office plug
      load: 8-15 W/m^2 (Watts/Area). Use 10 when unspecified.\n- Office equipment:
      fraction_radiant 0.5, fraction_latent 0, fraction_lost 0,\n  unless the specification
      says otherwise.\n","role":"system"},{"content":"Create exactly one ElectricEquipment

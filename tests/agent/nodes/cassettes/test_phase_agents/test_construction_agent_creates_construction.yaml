      exist in the materials list. >= 1 layer.\",\"parameters\":{\"properties\":{\"name\":{\"type\":\"string\"},\"layers\":{\"items\":{\"type\":\"string\"},\"type\":\"array\"}},\"required\":[\"name\",\"layers\"],\"type\":\"object\"}}},{\"type\":\"function\",\"function\":{\"name\":\"list_constructions\",\"description\":\"List

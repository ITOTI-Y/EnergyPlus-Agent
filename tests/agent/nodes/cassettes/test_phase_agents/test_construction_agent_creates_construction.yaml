      phase uses\\n   names that may differ from what the intake spec suggested.\\n2.
      Pick the correct layer composition for each construction using the\\n   material
      names returned by list_materials, verbatim.\\n3. Call `create_construction`
      for each construction in the spec.\\n4. Call `list_constructions` once at the
      end to confirm.\\n\\nRules:\\n- Layer names passed to `create_construction`
      MUST appear verbatim in\\n  the list_materials result (exact case, underscores,
      dashes, numbers).\\n- If a needed material is missing from list_materials, STOP
      and report\\n  the gap; do NOT invent names or call create with a broken reference.\\n-
      Each Construction is an ordered list of layers from OUTSIDE to INSIDE.\\n- Use
      separate constructions per surface type when thermal properties differ\\n  (e.g.,
      'ExtWall_Office', 'IntWall_Office', 'Roof_Office', 'Floor_Office',\\n  'Window_Office').\\n-
      For fenestration, the construction's only layer is the glazing material.\\n\",\"role\":\"system\"},{\"content\":\"Create
      exactly one construction named 'ExtWall_Simple' with a single layer 'Brick_100mm'.\",\"role\":\"user\"}],\"model\":\"opencode/glm-5.2\",\"max_completion_tokens\":64000,\"parallel_tool_calls\":false,\"stream\":false,\"temperature\":0.7,\"tool_choice\":\"required\",\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"create_construction\",\"description\":\"Create
